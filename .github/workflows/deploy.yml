# GitHub Pages へビルドして公開する。
#
# main に push するたびに、GitHub の用意したマシンの上で
# 「依存のインストール → テスト → ビルド → 公開」を自動で行う。
# 手元で npm run build してその成果物を置く、という手作業が要らなくなる。
#
# 事前に必要な設定(リポジトリの Settings → Pages):
#   Source を「GitHub Actions」にしておくこと。
#   「Deploy from a branch」のままだとこのワークフローの結果は反映されない。
name: Deploy to GitHub Pages

on:
  # main への push で自動的に走る
  push:
    branches: [main]
  # Actions のページから手動でも実行できるようにする
  workflow_dispatch:

# 公開に必要な権限だけを与える
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。続けて push したときは古い方を打ち切る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      # Node 24 を使う理由:
      #   テストは src/config/presets.ts を直接 import する。
      #   .ts を素の node で読むには型除去(type stripping)が必要で、
      #   これは Node 22.18 以降の機能。Node 20 だとここで落ちる(実際に失敗した)。
      #   開発機も v24 系なので揃えてある。
      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json のとおりに入れる(npm install と違いバージョンがぶれない)
      - name: 依存をインストール
        run: npm ci

      # テストが落ちたらここで止まり、壊れたものが公開されない
      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: ビルド結果を Pages 用に受け渡す
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # ビルドが成功したときだけ公開に進む
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
